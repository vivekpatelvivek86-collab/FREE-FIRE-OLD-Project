name: Experience of Old Free Fire - Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Extract, Validate and Build Android APK
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # 1. Download repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Locate the uploaded ZIP
      - name: Find Project ZIP
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Filter "*.zip" -File |
            Where-Object {
              $_.Name -eq "Experience_of_Old_Free_Fire_Full_Project_Fixed.zip"
            } |
            Select-Object -First 1

          if (-not $zip) {
            throw "Project ZIP not found in repository root."
          }

          "ZIP_PATH=$($zip.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Found project archive: $($zip.Name)"

      # 3. Extract the project archive
      - name: Extract Project ZIP
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "ExtractedProject"

          New-Item -ItemType Directory `
            -Path $destination -Force | Out-Null

          Expand-Archive `
            -LiteralPath $env:ZIP_PATH `
            -DestinationPath $destination `
            -Force

          $uproject = Get-ChildItem `
            -Path $destination `
            -Filter "ExperienceOfOldFreeFire.uproject" `
            -File -Recurse |
            Select-Object -First 1

          if (-not $uproject) {
            throw "Expected Unreal Engine project file was not found."
          }

          "PROJECT_DIR=$($uproject.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "UPROJECT_PATH=$($uproject.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Project extracted successfully."
          Write-Host "Project file: $($uproject.FullName)"

      # 4. Validate project files
      - name: Validate Project Structure
        shell: pwsh
        run: |
          $requiredFiles = @(
            "ExperienceOfOldFreeFire.uproject",
            "Source",
            "Config",
            "Build\Android\BuildSpec.json"
          )

          foreach ($item in $requiredFiles) {
            $path = Join-Path $env:PROJECT_DIR $item

            if (-not (Test-Path $path)) {
              throw "Required project item missing: $item"
            }

            Write-Host "PASS: $item"
          }

          $uproject = Get-Content `
            -LiteralPath $env:UPROJECT_PATH `
            -Raw | ConvertFrom-Json

          if (-not $uproject.Modules) {
            throw "No Unreal Engine modules found in project descriptor."
          }

          Write-Host "Project structure validation completed."

      # 5. Check Unreal Engine availability
      - name: Check Unreal Engine Installation
        id: engine
        shell: pwsh
        run: |
          $engineRoot = $env:UE_ROOT

          if (-not $engineRoot) {
            Write-Host "UE_ROOT is not configured."
            Write-Host "GitHub-hosted runners do not automatically include"
            Write-Host "a ready-to-use Unreal Engine 5.4 installation."
            "ENGINE_AVAILABLE=false" |
              Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          $uat = Join-Path $engineRoot `
            "Engine\Build\BatchFiles\RunUAT.bat"

          if (-not (Test-Path $uat)) {
            throw "RunUAT.bat not found under UE_ROOT: $engineRoot"
          }

          "ENGINE_AVAILABLE=true" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "UAT_PATH=$uat" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Unreal Engine build tools found."

      # 6. Build Android Development APK
      - name: Build Android APK
        if: env.ENGINE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "AndroidBuild"

          New-Item -ItemType Directory `
            -Path $output -Force | Out-Null

          & $env:UAT_PATH `
            BuildCookRun `
            "-project=$env:UPROJECT_PATH" `
            -noP4 `
            -platform=Android `
            -clientconfig=Development `
            -build `
            -cook `
            -stage `
            -pak `
            -archive `
            "-archivedirectory=$output" `
            -utf8output

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine Android build failed with exit code $LASTEXITCODE."
          }

          $apk = Get-ChildItem -Path $output `
            -Filter "*.apk" -File -Recurse |
            Select-Object -First 1

          if (-not $apk) {
            throw "Build completed without producing an APK."
          }

          "APK_PATH=$($apk.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "APK generated: $($apk.FullName)"

      # 7. Upload the APK when it exists
      - name: Upload Android APK
        if: success() && env.ENGINE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Experience-of-Old-Free-Fire-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      # 8. Save project and diagnostic logs
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Experience-of-Old-Free-Fire-Build-Diagnostics
          path: |
            ${{ runner.temp }}/ExtractedProject
            ${{ runner.temp }}/AndroidBuild
          if-no-files-found: ignore
          retention-days: 7

      # 9. Fail clearly if Unreal Engine is unavailable
      - name: Report Missing Unreal Engine
        if: env.ENGINE_AVAILABLE != 'true'
        shell: pwsh
        run: |
          Write-Error @"
          Project ZIP extraction and validation were attempted,
          but a compatible Unreal Engine installation was not found.

          An Android APK has NOT been generated.
          Configure an appropriate Unreal Engine build environment
          before running the Android packaging step.
          "@
